# The shared design. Every flyer inherits this and may override any part of it
# in its own yaml. Lengths accept in/mm/cm/pt (a bare number means points).

page:
  width: 8.5in
  height: 11in
  margin: 0.5in       # from the trim edge to the text
  gutter: 0.5in       # from the photo's edge to the text

grid:
  # The page is bisected across the photo's short axis: a portrait photo splits
  # it vertically (two columns), a landscape photo horizontally (two rows).
  split: auto         # auto | vertical | horizontal
  flow: auto          # auto | column | row  (auto: column on a vertical split)
  # The text sits on a column grid. A column flow is one column, so the fields
  # stack down the measure; a row flow is four, so they run across the band.
  # A field may span several columns (see `span` below) and one spanning them
  # all takes a grid row to itself.
  columns:
    column: 1
    row: 5
  column_gap: 16      # the grid gutter
  row_gap:            # a floor on the space between grid rows; a stacked field
    column: 0         # keeps its own space_after, a grid row gets some air
    row: 12
  row_align: bottom   # how blocks of different sizes sit within a grid row:
                      # bottom shares a baseline (top/center also accepted)

image:
  # Unset slots are picked deterministically from the flyer's name, so the same
  # content always renders the same flyer.
  cell: random        # start | end  (left/top | right/bottom) | random
  h_align: random     # start | middle | end  (left/center/right) | random
  v_align: random     # start | middle | end  (top/center/bottom) | random
  embed: true         # inline the photo as a data URI
  treatment:
    desaturate: 1.0   # 1.0 = fully grey before the ramp
    blend: auto       # auto = multiply on a light ground, screen on a dark one
    shadow: auto      # the ramp's dark end; auto follows the blend
    highlight: auto   # the ramp's light end; auto follows the blend

fonts:
  dir: fonts
  embed: true         # inline the weights this flyer uses, as @font-face
  weights:
    400: RethinkSans-Regular.ttf
    500: RethinkSans-Medium.ttf
    700: RethinkSans-Bold.ttf
    800: RethinkSans-ExtraBold.ttf

typography:
  family: Rethink Sans
  fallback: "'Helvetica Neue', Helvetica, Arial, sans-serif"
  align: random       # where the text block sits along its free axis
  text_length: true   # pin each line to its measured width, for renderer parity
  # Each entry is one cell of the grid. A list stacks those fields into one
  # cell, so the address sits under the venue and the time under the date.
  order:
    - [performer, openers]
    - [venue, address]
    - [date, time]
    - cost
    - details

  # space_after is optical: the gap left below a block's descenders, before
  # the next block's cap line. In row flow it is the gap to the next column.
  defaults:
    weight: 400
    leading: 1.3
    tracking: 0
    case: none
    color: ink
    space_after: 12
    bind_max: 3         # a word this short binds to the next one, so a name
                        # particle -- the "de" of De Angelis -- is never left
                        # alone at the end of a line. 0 turns it off.

  fields:
    performer:
      size: 58
      weight: 800
      case: upper
      tracking: -0.025
      leading: 0.92
      space_after: 14
      span: all       # the headline always takes the full measure
    openers:
      size: 22
      weight: 700
      case: upper
      tracking: 0.01
      leading: 1.15
      space_after: 20
      span: all
      join: " + "     # the supporting acts read as one bill, not a stack
      max_items: 4
    venue:
      size: 19
      weight: 700
      case: upper
      tracking: 0.06
      leading: 1.15
      space_after: 3
      span: 2         # long venue names still set on one line
    address:
      size: 11
      weight: 400
      leading: 1.25
      color: tint
      space_after: 4
      span: 2
    date:
      size: 19
      weight: 500
      leading: 1.15
      space_after: 2
      span: 2         # dates are long; give them two columns of the row grid
    time:
      size: 19
      weight: 500
      leading: 1.15
      color: tint     # the second line of the pair, held back toward the ground
      space_after: 13
      span: 2
    cost:
      size: 12
      weight: 700
      case: upper
      tracking: 0.09
      leading: 1.2
      space_after: 13
      span: 1         # the narrow column beside the time; long prices wrap
    details:
      size: 10.5
      weight: 400
      leading: 1.5
      space_after: 0
      span: 3         # the sentence needs a measure, not a column

formats:
  # Longest form first. A field takes the longest one that sets without
  # wrapping in the column the grid gives it, so a date only shortens when the
  # width demands it. This needs a real date in the yaml; a date written as a
  # string has only itself to offer.
  date:
    - "%A, %B %-d"    # Saturday, November 14
    - "%a, %B %-d"    # Sat, November 14
    - "%a, %b %-d"    # Sat, Nov 14
  time: "%-I:%M %p"

palette:
  # Monochrome: one ground colour per flyer. The ink is whichever of these two
  # reads on it, and the photo ramps between the ground and that same ink --
  # a multiply on a light ground, a screen on a dark one.
  ink:
    dark: "#000000"   # type on a light ground
    light: "#FFFFFF"  # type on a dark ground
  switch_at: auto     # auto = whichever ink has more contrast; or a luminance 0..1
  assign: series      # unpinned flyers take the next ground in rotation, so a
                      # run of them spreads across the palette; `independent`
                      # hashes each flyer on its own instead, which clumps
  tint: 0.72          # how far the `tint` role sits from the ground toward the ink
  colors:
    bone: "#EFE7DA"
    acid: "#DCE84B"
    mint: "#CFE3D4"
    clay: "#A63D26"
    dusk: "#17293B"
    night: "#1A1A1A"
