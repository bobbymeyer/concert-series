# The shared design. Every flyer inherits this and may override any part of it
# in its own yaml. Lengths accept in/mm/cm/pt (a bare number means points).

page:
  width: 8.5in
  height: 11in
  margin: 0.5in       # from the trim edge to the text
  gutter: 0.5in       # from the photo's edge to the text

grid:
  # The page is bisected across the photo's short axis: a portrait photo splits
  # it vertically (two columns), a landscape photo horizontally (two rows).
  split: auto         # auto | vertical | horizontal
  flow: auto          # auto | column | row  (auto: column on a vertical split)
  # Row flow only: columns wrap onto further rows when they run out of width.
  max_column: 0.5     # widest a single column may be, as a fraction of the band
  column_gap: 26      # between columns
  row_gap: 20         # between wrapped rows

image:
  # Unset slots are picked deterministically from the flyer's name, so the same
  # content always renders the same flyer.
  cell: random        # start | end  (left/top | right/bottom) | random
  h_align: random     # start | middle | end  (left/center/right) | random
  v_align: random     # start | middle | end  (top/center/bottom) | random
  embed: true         # inline the photo as a data URI
  treatment:
    desaturate: 1.0   # 1.0 = fully grey before the duotone ramp
    shadow: auto      # auto = the scheme's darker colour; "#000000" = a literal multiply
    highlight: auto   # auto = the scheme's lighter colour

fonts:
  dir: fonts
  embed: true         # inline the weights this flyer uses, as @font-face
  weights:
    400: RethinkSans-Regular.ttf
    500: RethinkSans-Medium.ttf
    700: RethinkSans-Bold.ttf
    800: RethinkSans-ExtraBold.ttf

typography:
  family: Rethink Sans
  fallback: "'Helvetica Neue', Helvetica, Arial, sans-serif"
  align: random       # where the text block sits along its free axis
  text_length: true   # pin each line to its measured width, for renderer parity
  order: [performer, venue, date, time, cost, details]

  # space_after is optical: the gap left below a block's descenders, before
  # the next block's cap line. In row flow it is the gap to the next column.
  defaults:
    weight: 400
    leading: 1.3
    tracking: 0
    case: none
    color: ink
    space_after: 12

  fields:
    performer:
      size: 58
      weight: 800
      case: upper
      tracking: -0.025
      leading: 0.92
      space_after: 14
    venue:
      size: 19
      weight: 700
      case: upper
      tracking: 0.06
      leading: 1.15
      space_after: 4
    date:
      size: 19
      weight: 500
      leading: 1.15
      color: accent
      space_after: 2
    time:
      size: 19
      weight: 500
      leading: 1.15
      space_after: 13
    cost:
      size: 12
      weight: 700
      case: upper
      tracking: 0.09
      leading: 1.2
      space_after: 13
    details:
      size: 10.5
      weight: 400
      leading: 1.5
      space_after: 0
      flex: true      # in row flow, this column absorbs the leftover width

formats:
  date: "%A, %B %-d"
  time: "%-I:%M %p"

palette:
  ink: "#17181A"      # the neutrals used when a scheme names no ink
  paper: "#FBF7F0"
  schemes:
    - name: bone
      background: "#EFE7DA"
      ink: "#17181A"
      accent: "#C8452D"
    - name: dusk
      background: "#17293B"
      ink: "#F0E6D6"
      accent: "#E9A13B"
    - name: acid
      background: "#DCE84B"
      ink: "#17181A"
      accent: "#2B3AAE"
    - name: clay
      background: "#C9563C"
      ink: "#FBF1E2"
      accent: "#17293B"
    - name: mint
      background: "#CFE3D4"
      ink: "#16322A"
      accent: "#B4462E"
    - name: night
      background: "#1A1A1A"
      ink: "#F2F2F0"
      accent: "#F2C14E"
